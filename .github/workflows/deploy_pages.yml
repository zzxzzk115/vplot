name: Deploy Pages

# Builds every web-capable example to WebAssembly and publishes the website
# (landing page + browser-runnable example gallery) to GitHub Pages.
# One-time repo setting: Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build wasm examples + assemble site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # xmake must be set up BEFORE emsdk: with EMSDK active the setup action
      # cross-builds xmake itself to wasm and fails. Install it first (host build).
      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Build wasm examples + assemble site
        run: bash scripts/build_site.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy to github pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
